interface:
  display_name: "Math Modeling Data Preprocessing"
  short_description: "面向数模的数据、来源、结构与防泄漏预处理复核"
  default_prompt: "请先从现有题面、数据和上下文形成任务清单，明确任务模式、输入可访问性、分析粒度、目标时点、输出方式与事实状态；只有预处理决策需要模型指标、阈值选择或未见表现声明时才确认 model_contract，否则标记模型验证不适用。缺少且会阻止安全处理时只补问一个关键问题。随后按适用性核验来源、字段语义、列名/类型/日期转换、重复与连接关系、异常和缺失、时间可用性及防泄漏。实际执行时输出变更日志；仅复核现有产物时列出可观察证据、缺失证据和剩余风险，不补造历史结果。"
